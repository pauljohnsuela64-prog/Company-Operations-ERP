{% extends "base.html" %}

{% block title %}
Add Asset Maintenance
{% endblock %}


{% block content %}

<div class="mb-4">

    <h2 class="mb-1">
        Add Maintenance
    </h2>

    <p class="text-muted mb-0">
        {{ asset.asset_tag }}
        -
        {{ asset.asset_name }}
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}

            <div class="row g-3">


                <!-- # MAINTENANCE TYPE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Maintenance Type
                    </label>

                    <select
                        name="maintenance_type"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Type
                        </option>

                        <option value="Repair">
                            Repair
                        </option>

                        <option value="Preventive Maintenance">
                            Preventive Maintenance
                        </option>

                        <option value="Upgrade">
                            Upgrade
                        </option>

                        <option value="Inspection">
                            Inspection
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- # START DATE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Start Date
                    </label>

                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        required
                    >

                </div>


                <!-- # DESCRIPTION -->

                <div class="col-12">

                    <label class="form-label">
                        Description
                    </label>

                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        maxlength="255"
                        required
                    >

                </div>


                <!-- # VENDOR -->

                <div class="col-md-6">

                    <label class="form-label">
                        Vendor / Service Provider
                    </label>

                    <input
                        type="text"
                        name="vendor"
                        class="form-control"
                        maxlength="150"
                    >

                </div>


                <!-- # COST -->

                <div class="col-md-6">

                    <label class="form-label">
                        Cost
                    </label>

                    <input
                        type="number"
                        name="cost"
                        class="form-control"
                        min="0"
                        step="0.01"
                    >

                </div>


                <!-- # NOTES -->

                <div class="col-12">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        maxlength="255"
                    ></textarea>

                </div>

            </div>


            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Start Maintenance
                </button>

                <a
                    href="{{ url_for(
                        'view_it_asset',
                        asset_id=asset.asset_id
                    ) }}"
                    class="btn btn-outline-secondary ms-2"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
