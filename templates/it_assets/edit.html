{% extends "base.html" %}

{% block title %}
Edit IT Asset
{% endblock %}


{% block content %}

<div class="mb-4">

    <h2 class="mb-1">
        Edit IT Asset
    </h2>

    <p class="text-muted mb-0">
        {{ asset.asset_tag }}
        -
        {{ asset.asset_name }}
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}

            <div class="row g-3">

                <div class="col-md-4">

                    <label class="form-label">
                        Asset Tag
                    </label>

                    <input
                        type="text"
                        name="asset_tag"
                        class="form-control"
                        value="{{ asset.asset_tag }}"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Asset Name
                    </label>

                    <input
                        type="text"
                        name="asset_name"
                        class="form-control"
                        value="{{ asset.asset_name }}"
                        maxlength="150"
                        required
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="category_id"
                        class="form-select"
                        required
                    >

                        {% for category in categories %}

                            <option
                                value="{{ category.category_id }}"
                                {% if
                                    category.category_id
                                    == asset.category_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ category.category_code }}
                                -
                                {{ category.category_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Brand
                    </label>

                    <input
                        type="text"
                        name="brand"
                        class="form-control"
                        value="{{ asset.brand or '' }}"
                        maxlength="100"
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Model
                    </label>

                    <input
                        type="text"
                        name="model"
                        class="form-control"
                        value="{{ asset.model or '' }}"
                        maxlength="100"
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Serial Number
                    </label>

                    <input
                        type="text"
                        name="serial_number"
                        class="form-control"
                        value="{{ asset.serial_number or '' }}"
                        maxlength="100"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Department
                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                    >

                        <option value="">
                            No Department
                        </option>

                        {% for department in departments %}

                            <option
                                value="{{ department.department_id }}"
                                {% if
                                    department.department_id
                                    == asset.department_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ department.department_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Condition
                    </label>

                    <select
                        name="condition_status"
                        class="form-select"
                    >

                        {% for condition in [
                            "NEW",
                            "GOOD",
                            "FAIR",
                            "POOR",
                            "DAMAGED"
                        ] %}

                            <option
                                value="{{ condition }}"
                                {% if
                                    condition
                                    == asset.condition_status
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ condition.title() }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Purchase Date
                    </label>

                    <input
                        type="date"
                        name="purchase_date"
                        class="form-control"
                        value="{{ asset.purchase_date or '' }}"
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Purchase Cost
                    </label>

                    <input
                        type="number"
                        name="purchase_cost"
                        class="form-control"
                        value="{{ asset.purchase_cost or '' }}"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Warranty Expiry
                    </label>

                    <input
                        type="date"
                        name="warranty_expiry"
                        class="form-control"
                        value="{{ asset.warranty_expiry or '' }}"
                    >

                </div>


                <div class="col-12">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        maxlength="255"
                    >{{ asset.notes or "" }}</textarea>

                </div>

            </div>


            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for(
                        'view_it_asset',
                        asset_id=asset.asset_id
                    ) }}"
                    class="btn btn-outline-secondary ms-2"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
