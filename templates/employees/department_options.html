<option value="" {% if not selected_department %}selected{% endif %}>No Department</option>
{% if unavailable_department %}
    <option value="{{ selected_department }}" selected>Unavailable department ({{ selected_department }}) — choose an eligible department</option>
{% endif %}
{% for department in departments %}
    <option value="{{ department.department_id }}" {% if selected_department == department.department_id|string %}selected{% endif %}>
        {{ department.department_code }} - {{ department.department_name }}{% if department.is_active is defined and not department.is_active %} (Inactive){% endif %}
    </option>
{% endfor %}
