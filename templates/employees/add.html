{% extends "base.html" %}

{% block title %}
Add Employee | Company Operations ERP
{% endblock %}

{% block page_title %}
Add Employee
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-xl-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h4 class="mb-1">
                    New Employee
                </h4>

                <p class="text-muted mb-4">
                    Add a new employee to the company.
                </p>

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Employee Number
                            </label>

                            <input
                                type="text"
                                name="employee_number"
                                class="form-control"
                                maxlength="30"
                                value="{{ request.form.get('employee_number', '') }}"
                                placeholder="Example: EMP-001"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <select
                                name="department_id"
                                class="form-select"
                            >

                                <option value="">
                                    No Department
                                </option>

                                {% for department in departments %}

                                    <option
                                        value="{{ department.department_id }}"
                                        {% if request.form.get('department_id') == department.department_id|string %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ department.department_code }}
                                        -
                                        {{ department.department_name }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                value="{{ request.form.get('first_name', '') }}"
                                required
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Middle Name
                            </label>

                            <input
                                type="text"
                                name="middle_name"
                                class="form-control"
                                value="{{ request.form.get('middle_name', '') }}"
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                class="form-control"
                                value="{{ request.form.get('last_name', '') }}"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ request.form.get('email', '') }}"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ request.form.get('phone', '') }}"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="job_title"
                                class="form-control"
                                value="{{ request.form.get('job_title', '') }}"
                            >

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Hire Date
                            </label>

                            <input
                                type="date"
                                name="hire_date"
                                class="form-control"
                                value="{{ request.form.get('hire_date', '') }}"
                            >

                        </div>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Employee
                        </button>

                        <a
                            href="{{ url_for('employees') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
