{% extends "base.html" %}

{% block title %}
Manage Role Permissions
{% endblock %}


{% block content %}
<div class="workspace-page workflow-page modern-page">

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <p class="workspace-eyebrow">Company operations</p>
<h1>Manage Permissions</h1>

    <p class="text-muted mb-0">
        Role:
        <strong>{{ role.role_name }}</strong>
    </p>

</div>


<form method="POST">
                    {% include 'partials/csrf_field.html' %}

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <!-- # ====================================== -->
            <!-- # PERMISSION CHECKBOXES -->
            <!-- # ====================================== -->

            <div class="row">

                {% for permission in permissions %}

                    <div class="col-md-6 col-lg-4 mb-3">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="permission_ids"
                                value="{{ permission.permission_id }}"
                                id="permission_{{ permission.permission_id }}"
                                {% if permission.permission_id in selected_permission_ids %}
                                    checked
                                {% endif %}
                            >


                            <label
                                class="form-check-label"
                                for="permission_{{ permission.permission_id }}"
                            >

                                <strong>
                                    {{ permission.permission_code }}
                                </strong>

                                {% if permission.description %}

                                    <div class="small text-muted">
                                        {{ permission.description }}
                                    </div>

                                {% endif %}

                            </label>

                        </div>

                    </div>

                {% endfor %}

            </div>

        </div>

    </div>


    <!-- # ========================================== -->
    <!-- # BUTTONS -->
    <!-- # ========================================== -->

    <div class="workflow-actions">

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Permissions
        </button>


        <a
            href="{{ url_for('admin_roles') }}"
            class="btn btn-outline-secondary"
        >
            Cancel
        </a>

    </div>

</form>

</div>
{% endblock %}
