{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}


{% block content %}

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <h2 class="mb-1">
        Reset Password
    </h2>

    <p class="text-muted mb-0">
        Set a new password for
        <strong>{{ user.username }}</strong>.
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">


            <!-- # NEW PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    minlength="8"
                    required
                >

                <div class="form-text">
                    Minimum 8 characters.
                </div>

            </div>


            <!-- # CONFIRM PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>


            <!-- # BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Reset Password
                </button>


                <a
                    href="{{ url_for('admin_users') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
