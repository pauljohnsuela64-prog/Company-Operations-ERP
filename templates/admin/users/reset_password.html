{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}


{% block content %}
<div class="workspace-page workflow-page modern-page">

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <p class="workspace-eyebrow">Company operations</p>
<h1>Reset Password</h1>

    <p class="text-muted mb-0">
        Set a new password for
        <strong>{{ user.username }}</strong>.
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}


            <!-- # NEW PASSWORD -->

            <div class="mb-3">

                <label class="form-label" for="field-password">
                    New Password
                </label>

                <input id="field-password"
                    type="password"
                    name="password"
                    class="form-control"
                    minlength="8"
                    required
                >

                <div class="form-text">
                    Minimum 8 characters.
                </div>

            </div>


            <!-- # CONFIRM PASSWORD -->

            <div class="mb-4">

                <label class="form-label" for="field-confirm_password">
                    Confirm New Password
                </label>

                <input id="field-confirm_password"
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>


            <!-- # BUTTONS -->

            <div class="workflow-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Reset Password
                </button>


                <a
                    href="{{ url_for('admin_users') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>
{% endblock %}
