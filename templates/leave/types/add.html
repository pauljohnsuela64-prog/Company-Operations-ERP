{% extends "base.html" %}

{% block title %}
Add Leave Type
{% endblock %}


{% block content %}

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <h2 class="mb-1">
        Add Leave Type
    </h2>

    <p class="text-muted mb-0">
        Create a new company leave category.
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}


            <!-- # LEAVE CODE -->

            <div class="mb-3">

                <label class="form-label">
                    Leave Code
                </label>

                <input
                    type="text"
                    name="leave_code"
                    value="{{ form.leave_code if form.leave_code is not none else '' }}"
                    class="form-control"
                    maxlength="30"
                    required
                >

            </div>


            <!-- # LEAVE NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Leave Name
                </label>

                <input
                    type="text"
                    name="leave_name"
                    value="{{ form.leave_name if form.leave_name is not none else '' }}"
                    class="form-control"
                    maxlength="100"
                    required
                >

            </div>


            <!-- # ANNUAL ENTITLEMENT -->

            <div class="mb-3">

                <label class="form-label">
                    Annual Entitlement
                </label>

                <input
                    type="number"
                    name="annual_entitlement"
                    value="{{ form.annual_entitlement if form.annual_entitlement is not none else '' }}"
                    class="form-control"
                    min="0"
                    step="0.5"
                >

                <div class="form-text">
                    Leave blank if there is no fixed annual limit.
                </div>

            </div>


            <!-- # DESCRIPTION -->

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    maxlength="255"
                    rows="3"
                >{{ form.description or '' }}</textarea>

            </div>


            <!-- # PAID LEAVE -->

            <div class="mb-4 form-check">

                <input
                    type="checkbox"
                    name="is_paid"
                    value="1"
                    class="form-check-input"
                    id="is_paid"
                    {% if form.is_paid %}checked{% endif %}
                >

                <label
                    class="form-check-label"
                    for="is_paid"
                >
                    Paid Leave
                </label>

            </div>


            <!-- # BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Leave Type
                </button>


                <a
                    href="{{ url_for('leave_types') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
