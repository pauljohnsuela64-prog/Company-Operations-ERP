{% extends "base.html" %}

{% block title %}
New Leave Request
{% endblock %}


{% block content %}

<h2 class="mb-4">
    New Leave Request
</h2>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}


            <div class="mb-3">

                <label class="form-label">
                    Employee
                </label>

                <select
                    name="employee_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Employee
                    </option>

                    {% for employee in employees %}

                        <option
                            value="{{ employee.employee_id }}"
                        >
                            {{ employee.employee_number }}
                            -
                            {{ employee.first_name }}
                            {{ employee.last_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Leave Type
                </label>

                <select
                    name="leave_type_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Leave Type
                    </option>

                    {% for leave_type in leave_types %}

                        <option
                            value="{{ leave_type.leave_type_id }}"
                        >
                            {{ leave_type.leave_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Start Date
                    </label>

                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        End Date
                    </label>

                    <input
                        type="date"
                        name="end_date"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Reason
                </label>

                <textarea
                    name="reason"
                    class="form-control"
                    maxlength="500"
                    rows="4"
                    required
                ></textarea>

            </div>


            <div class="d-flex gap-2">

                <button
                    class="btn btn-primary"
                >
                    Submit Leave Request
                </button>

                <a
                    href="{{ url_for('leave_requests') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
