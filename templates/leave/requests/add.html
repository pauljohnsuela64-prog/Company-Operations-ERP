{% extends "base.html" %}

{% block title %}
New Leave Request
{% endblock %}


{% block content %}
<div class="workspace-page workflow-page modern-page">

<p class="workspace-eyebrow">Company operations</p>
<h1>New Leave Request</h1>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}


            <div class="mb-3">

                <label class="form-label" for="field-employee_id">
                    Employee
                </label>

                <select id="field-employee_id"
                    name="employee_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Employee
                    </option>

                    {% if unavailable_employee %}<option value="{{ form.employee_id }}" selected>Unavailable Employee ({{ form.employee_id }})</option>{% endif %}
                    {% for employee in employees %}

                        <option
                            value="{{ employee.employee_id }}" {% if form.employee_id == employee.employee_id|string %}selected{% endif %}
                        >
                            {{ employee.employee_number }}
                            -
                            {{ employee.first_name }}
                            {{ employee.last_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label" for="field-leave_type_id">
                    Leave Type
                </label>

                <select id="field-leave_type_id"
                    name="leave_type_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Leave Type
                    </option>

                    {% if unavailable_type %}<option value="{{ form.leave_type_id }}" selected>Unavailable Leave type ({{ form.leave_type_id }})</option>{% endif %}
                    {% for leave_type in leave_types %}

                        <option
                            value="{{ leave_type.leave_type_id }}" {% if form.leave_type_id == leave_type.leave_type_id|string %}selected{% endif %}
                        >
                            {{ leave_type.leave_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label" for="field-start_date">
                        Start Date
                    </label>

                    <input id="field-start_date"
                        type="date"
                        name="start_date"
                        value="{{ form.start_date }}"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label" for="field-end_date">
                        End Date
                    </label>

                    <input id="field-end_date"
                        type="date"
                        name="end_date"
                        value="{{ form.end_date }}"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <div class="mb-4">

                <label class="form-label" for="field-reason">
                    Reason
                </label>

                <textarea id="field-reason"
                    name="reason"
                    class="form-control"
                    maxlength="500"
                    rows="4"
                    required
                >{{ form.reason }}</textarea>

            </div>


            <div class="workflow-actions">

                <button
                    class="btn btn-primary"
                >
                    Submit Leave Request
                </button>

                <a
                    href="{{ url_for('leave_requests') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>
{% endblock %}
