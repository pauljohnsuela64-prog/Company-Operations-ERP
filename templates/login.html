<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Company Operations ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

<main class="container auth-shell" id="main-content">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-12">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <p class="workspace-eyebrow text-center">Company operations</p>
                    <h1 class="auth-title text-center mb-2">
                        Company Operations ERP
                    </h1>

                    <p class="text-center text-muted mb-4">
                        Sign in to continue
                    </p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">
                    {% include 'partials/csrf_field.html' %}

                        <div class="mb-3">
                            <label class="form-label" for="login-username">Username</label>

                            <input
                                type="text"
                                id="login-username" name="username"
                                class="form-control"
                                required
                                autofocus
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="login-password">Password</label>

                            <input
                                type="password"
                                id="login-password" name="password"
                                class="form-control"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
</main>

</body>
</html>
