{% extends "base.html" %}

{% block title %}
Edit Cost | {{ purchase_order.po_number }}
{% endblock %}

{% block page_title %}
Edit Purchase Order Item Cost
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-lg-7">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h4 class="mb-1">
                    Edit Unit Cost
                </h4>

                <p class="text-muted mb-4">
                    Update the supplier unit cost for
                    {{ purchase_order.po_number }}.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Unit Cost
                        </label>

                        <input
                            type="number"
                            name="unit_cost"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="{{ request.form.get(
                                'unit_cost',
                                purchase_order_item.unit_cost
                            ) }}"
                            required
                        >

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Cost
                        </button>

                        <a
                            href="{{ url_for(
                                'view_purchase_order',
                                purchase_order_id=purchase_order.purchase_order_id
                            ) }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
