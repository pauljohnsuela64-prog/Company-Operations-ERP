{% extends "base.html" %}

{% block title %}
Edit Supplier | Company Operations ERP
{% endblock %}

{% block page_title %}
Edit Supplier
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-xl-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h4 class="mb-1">
                    Edit Supplier
                </h4>

                <p class="text-muted mb-4">
                    Update supplier information.
                </p>

                <form method="POST">
                    {% include 'partials/csrf_field.html' %}

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Supplier Code
                            </label>

                            <input
                                type="text"
                                name="supplier_code"
                                class="form-control"
                                maxlength="30"
                                value="{{ request.form.get(
                                    'supplier_code',
                                    supplier.supplier_code
                                ) }}"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Supplier Name
                            </label>

                            <input
                                type="text"
                                name="supplier_name"
                                class="form-control"
                                maxlength="150"
                                value="{{ request.form.get(
                                    'supplier_name',
                                    supplier.supplier_name
                                ) }}"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Contact Person
                            </label>

                            <input
                                type="text"
                                name="contact_person"
                                class="form-control"
                                maxlength="100"
                                value="{{ request.form.get(
                                    'contact_person',
                                    supplier.contact_person or ''
                                ) }}"
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                maxlength="150"
                                value="{{ request.form.get(
                                    'email',
                                    supplier.email or ''
                                ) }}"
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                maxlength="30"
                                value="{{ request.form.get(
                                    'phone',
                                    supplier.phone or ''
                                ) }}"
                            >

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="3"
                                maxlength="255"
                            >{{ request.form.get(
                                'address',
                                supplier.address or ''
                            ) }}</textarea>

                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{{ url_for('suppliers') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
