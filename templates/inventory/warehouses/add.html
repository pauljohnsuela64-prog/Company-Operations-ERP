{% extends "base.html" %}

{% block title %}
Add Warehouse | Company Operations ERP
{% endblock %}

{% block page_title %}
Add Warehouse
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-lg-7 col-xl-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h4 class="mb-1">
                    New Warehouse
                </h4>

                <p class="text-muted mb-4">
                    Add a new inventory storage location.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Warehouse Code
                        </label>

                        <input
                            type="text"
                            name="warehouse_code"
                            class="form-control"
                            maxlength="30"
                            value="{{ request.form.get('warehouse_code', '') }}"
                            placeholder="Example: MAIN"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Warehouse Name
                        </label>

                        <input
                            type="text"
                            name="warehouse_name"
                            class="form-control"
                            maxlength="100"
                            value="{{ request.form.get('warehouse_name', '') }}"
                            placeholder="Example: Main Warehouse"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            maxlength="255"
                            value="{{ request.form.get('location', '') }}"
                            placeholder="Example: Head Office - Ground Floor"
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Warehouse
                        </button>

                        <a
                            href="{{ url_for('warehouses') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
