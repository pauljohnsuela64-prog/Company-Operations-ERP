{% extends "base.html" %}

{% block title %}
Edit Attendance
{% endblock %}


{% block content %}

<div class="mb-4">

    <h2 class="mb-1">
        Edit Attendance
    </h2>

    <p class="text-muted mb-0">
        Update an existing attendance record.
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">


            <!-- # EMPLOYEE -->

            <div class="mb-3">

                <label class="form-label">
                    Employee
                </label>

                <select
                    name="employee_id"
                    class="form-select"
                    required
                >

                    {% for employee in employees %}

                        <option
                            value="{{ employee.employee_id }}"
                            {% if employee.employee_id == attendance_record.employee_id %}
                                selected
                            {% endif %}
                        >

                            {{ employee.employee_number }}
                            -
                            {{ employee.first_name }}
                            {{ employee.last_name }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- # DATE -->

            <div class="mb-3">

                <label class="form-label">
                    Attendance Date
                </label>

                <input
                    type="date"
                    name="attendance_date"
                    class="form-control"
                    value="{{ attendance_record.attendance_date }}"
                    required
                >

            </div>


            <div class="row">


                <!-- # TIME IN -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Time In
                    </label>

                    <input
                        type="time"
                        name="time_in"
                        class="form-control"
                        value="{{ attendance_record.time_in or '' }}"
                    >

                </div>


                <!-- # TIME OUT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Time Out
                    </label>

                    <input
                        type="time"
                        name="time_out"
                        class="form-control"
                        value="{{ attendance_record.time_out or '' }}"
                    >

                </div>

            </div>


            <!-- # STATUS -->

            <div class="mb-3">

                <label class="form-label">
                    Status
                </label>

                <select
                    name="status"
                    class="form-select"
                    required
                >

                    {% for status in allowed_statuses %}

                        <option
                            value="{{ status }}"
                            {% if status == attendance_record.status %}
                                selected
                            {% endif %}
                        >
                            {{ status.replace("_", " ").title() }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- # NOTES -->

            <div class="mb-4">

                <label class="form-label">
                    Notes
                </label>

                <textarea
                    name="notes"
                    class="form-control"
                    maxlength="255"
                    rows="3"
                >{{ attendance_record.notes or "" }}</textarea>

            </div>


            <!-- # BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>


                <a
                    href="{{ url_for('attendance') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
