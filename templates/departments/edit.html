{% extends "base.html" %}


{% block title %}
Edit Department | Company Operations ERP
{% endblock %}


{% block page_title %}
Edit Department
{% endblock %}


{% block content %}

<div class="row">

    <div class="col-lg-7 col-xl-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h4 class="mb-1">
                    Edit Department
                </h4>

                <p class="text-muted mb-4">
                    Update department information.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Department Code
                        </label>

                        <input
                            type="text"
                            name="department_code"
                            class="form-control"
                            maxlength="20"
                            value="{{ request.form.get(
                                'department_code',
                                department.department_code
                            ) }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Department Name
                        </label>

                        <input
                            type="text"
                            name="department_name"
                            class="form-control"
                            maxlength="100"
                            value="{{ request.form.get(
                                'department_name',
                                department.department_name
                            ) }}"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            maxlength="255"
                        >{{ request.form.get(
                            'description',
                            department.description or ''
                        ) }}</textarea>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{{ url_for('departments') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
