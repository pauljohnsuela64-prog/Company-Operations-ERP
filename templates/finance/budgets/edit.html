{% extends "base.html" %}

{% block title %}
Edit Department Budget
{% endblock %}


{% block content %}
<div class="workspace-page workflow-page modern-page">

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <p class="workspace-eyebrow">Company operations</p>
<h1>Edit Department Budget</h1>

    <p class="text-muted mb-0">
        Update the annual budget for a department.
    </p>

</div>


<!-- # ========================================== -->
<!-- # EDIT BUDGET FORM -->
<!-- # ========================================== -->

<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST" action="{{ url_for(
                'edit_department_budget',
                budget_id=budget.budget_id
            ) }}">
                    {% include 'partials/csrf_field.html' %}

            <div class="row g-3">


                <!-- # DEPARTMENT -->

                <div class="col-md-6">

                    <label class="form-label" for="field-department_id">
                        Department
                    </label>

                    <select id="field-department_id" name="department_id" class="form-select" required>

                        {% if unlisted_department %}<option value="{{ budget_form.department_id }}" selected>Selected Department (not in current list)</option>{% endif %}
                        {% for department in departments %}

                        <option value="{{ department.department_id }}" {% if
                            department.department_id|string==budget_form.department_id %} selected {% endif %}>
                            {{ department.department_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # BUDGET YEAR -->

                <div class="col-md-6">

                    <label class="form-label" for="field-budget_year">
                        Budget Year
                    </label>

                    <input id="field-budget_year" type="text" inputmode="numeric" name="budget_year" class="form-control" value="{{ budget_form.budget_year }}" pattern="[0-9]{4}" required>

                </div>


                <!-- # BUDGET AMOUNT -->

                <div class="col-md-6">

                    <label class="form-label" for="field-budget_amount">
                        Budget Amount
                    </label>

                    <input id="field-budget_amount" type="text" inputmode="decimal" name="budget_amount" max="999999999999.99" class="form-control" value="{{ budget_form.budget_amount }}"
                        min="0.01" step="0.01" required>

                </div>


                <!-- # NOTES -->

                <div class="col-12">

                    <label class="form-label" for="field-notes">
                        Notes
                    </label>

                    <textarea id="field-notes" name="notes" class="form-control" rows="3"
                        maxlength="255">{{ budget_form.notes }}</textarea>

                </div>

            </div>


            <!-- # FORM BUTTONS -->

            <div class="mt-4">

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{{ url_for('department_budgets') }}" class="btn btn-outline-secondary ms-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>
{% endblock %}
