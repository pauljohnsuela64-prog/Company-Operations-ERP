{% extends "base.html" %}

{% block title %}
Edit Department Budget
{% endblock %}


{% block content %}

<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="mb-4">

    <h2 class="mb-1">
        Edit Department Budget
    </h2>

    <p class="text-muted mb-0">
        Update the annual budget for a department.
    </p>

</div>


<!-- # ========================================== -->
<!-- # EDIT BUDGET FORM -->
<!-- # ========================================== -->

<div class="card shadow-sm border-0">

    <div class="card-body">

        <form
            method="POST"
            action="{{ url_for(
                'edit_department_budget',
                budget_id=budget.budget_id
            ) }}"
        >

            <div class="row g-3">


                <!-- # DEPARTMENT -->

                <div class="col-md-6">

                    <label class="form-label">
                        Department
                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                        required
                    >

                        {% for department in departments %}

                            <option
                                value="{{ department.department_id }}"
                                {% if
                                    department.department_id
                                    == budget.department_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ department.department_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # BUDGET YEAR -->

                <div class="col-md-6">

                    <label class="form-label">
                        Budget Year
                    </label>

                    <input
                        type="number"
                        name="budget_year"
                        class="form-control"
                        value="{{ budget.budget_year }}"
                        min="2000"
                        max="2100"
                        required
                    >

                </div>


                <!-- # BUDGET AMOUNT -->

                <div class="col-md-6">

                    <label class="form-label">
                        Budget Amount
                    </label>

                    <input
                        type="number"
                        name="budget_amount"
                        class="form-control"
                        value="{{ budget.budget_amount }}"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <!-- # NOTES -->

                <div class="col-12">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        maxlength="255"
                    >{{ budget.notes or "" }}</textarea>

                </div>

            </div>


            <!-- # FORM BUTTONS -->

            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('department_budgets') }}"
                    class="btn btn-outline-secondary ms-2"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
