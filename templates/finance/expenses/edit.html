{% extends "base.html" %}


{% block title %}
Edit Expense
{% endblock %}


{% block page_title %}
Edit Expense
{% endblock %}


{% block content %}


<!-- # ========================================== -->
<!-- # PAGE HEADER -->
<!-- # ========================================== -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="mb-1">
            Edit {{ expense.expense_number }}
        </h2>

        <p class="text-muted mb-0">
            Update this draft expense.
        </p>

    </div>

    <a
        href="{{ url_for(
            'view_expense',
            expense_id=expense.expense_id
        ) }}"
        class="btn btn-outline-secondary"
    >
        Back
    </a>

</div>


<!-- # ========================================== -->
<!-- # EXPENSE FORM -->
<!-- # ========================================== -->

<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}

            <div class="row">


                <!-- # DATE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Expense Date
                    </label>

                    <input
                        type="date"
                        name="expense_date"
                        class="form-control"
                        value="{{ request.form.get(
                            'expense_date',
                            expense.expense_date
                        ) }}"
                        required
                    >

                </div>


                <!-- # CATEGORY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Expense Category
                    </label>

                    <select
                        name="category_id"
                        class="form-select"
                        required
                    >

                        {% for category in categories %}

                            <option
                                value="{{ category.category_id }}"
                                {% if
                                    request.form.get(
                                        'category_id',
                                        expense.category_id|string
                                    )
                                    == category.category_id|string
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ category.category_code }}
                                -
                                {{ category.category_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # DEPARTMENT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                    >

                        <option value="">
                            None
                        </option>

                        {% for department in departments %}

                            <option
                                value="{{ department.department_id }}"
                                {% if
                                    expense.department_id
                                    == department.department_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ department.department_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # SUPPLIER -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Supplier
                    </label>

                    <select
                        name="supplier_id"
                        class="form-select"
                    >

                        <option value="">
                            None
                        </option>

                        {% for supplier in suppliers %}

                            <option
                                value="{{ supplier.supplier_id }}"
                                {% if
                                    expense.supplier_id
                                    == supplier.supplier_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ supplier.supplier_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # PURCHASE ORDER -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Purchase Order
                    </label>

                    <select
                        name="purchase_order_id"
                        class="form-select"
                    >

                        <option value="">
                            None
                        </option>

                        {% for purchase_order in purchase_orders %}

                            <option
                                value="{{ purchase_order.purchase_order_id }}"
                                {% if
                                    expense.purchase_order_id
                                    == purchase_order.purchase_order_id
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ purchase_order.po_number }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # PAYMENT METHOD -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select
                        name="payment_method"
                        class="form-select"
                    >

                        <option value="">
                            Not specified
                        </option>

                        {% for method in [
                            "CASH",
                            "BANK_TRANSFER",
                            "CHECK",
                            "CARD",
                            "OTHER"
                        ] %}

                            <option
                                value="{{ method }}"
                                {% if
                                    expense.payment_method == method
                                %}
                                    selected
                                {% endif %}
                            >
                                {{ method.replace("_", " ") }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- # DESCRIPTION -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        maxlength="255"
                        value="{{ request.form.get(
                            'description',
                            expense.description
                        ) }}"
                        required
                    >

                </div>


                <!-- # AMOUNT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        name="amount"
                        class="form-control"
                        min="0.01"
                        step="0.01"
                        value="{{ request.form.get(
                            'amount',
                            expense.amount
                        ) }}"
                        required
                    >

                </div>


                <!-- # REFERENCE NUMBER -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Reference Number
                    </label>

                    <input
                        type="text"
                        name="reference_number"
                        class="form-control"
                        maxlength="100"
                        value="{{ request.form.get(
                            'reference_number',
                            expense.reference_number or ''
                        ) }}"
                    >

                </div>


                <!-- # NOTES -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        maxlength="255"
                    >{{ request.form.get(
                        'notes',
                        expense.notes or ''
                    ) }}</textarea>

                </div>

            </div>


            <!-- # SAVE -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>


{% endblock %}
