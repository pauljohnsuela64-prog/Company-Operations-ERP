{% extends "base.html" %}

{% block title %}
New Payroll Period
{% endblock %}


{% block content %}
<div class="workspace-page workflow-page modern-page">

<div class="mb-4">

    <p class="workspace-eyebrow">Company operations</p>
<h1>New Payroll Period</h1>

    <p class="text-muted mb-0">
        Create a payroll cutoff and payment schedule.
    </p>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST">
                    {% include 'partials/csrf_field.html' %}


            <!-- # PERIOD NAME -->

            <div class="mb-3">

                <label class="form-label" for="field-period_name">
                    Period Name
                </label>

                <input id="field-period_name"
                    type="text"
                    name="period_name"
                    class="form-control"
                    maxlength="100"
                    placeholder="Example: October 1-15, 2026"
                    required
                >

            </div>


            <div class="row">


                <!-- # START DATE -->

                <div class="col-md-4 mb-3">

                    <label class="form-label" for="field-start_date">
                        Start Date
                    </label>

                    <input id="field-start_date"
                        type="date"
                        name="start_date"
                        class="form-control"
                        required
                    >

                </div>


                <!-- # END DATE -->

                <div class="col-md-4 mb-3">

                    <label class="form-label" for="field-end_date">
                        End Date
                    </label>

                    <input id="field-end_date"
                        type="date"
                        name="end_date"
                        class="form-control"
                        required
                    >

                </div>


                <!-- # PAY DATE -->

                <div class="col-md-4 mb-3">

                    <label class="form-label" for="field-pay_date">
                        Pay Date
                    </label>

                    <input id="field-pay_date"
                        type="date"
                        name="pay_date"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <!-- # NOTES -->

            <div class="mb-4">

                <label class="form-label" for="field-notes">
                    Notes
                </label>

                <textarea id="field-notes"
                    name="notes"
                    class="form-control"
                    maxlength="255"
                    rows="3"
                ></textarea>

            </div>


            <!-- # BUTTONS -->

            <div class="workflow-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Payroll Period
                </button>


                <a
                    href="{{ url_for('payroll_periods') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>
{% endblock %}
