<p class="text-muted">Record known exceptions below. These remain unsupported for publication; no holiday or special-pay rule is assumed. Leave the final row blank if there are no further known exceptions. An empty list is not authoritative calendar verification.</p>
{% for exception in exceptions + [{}] %}<div class="row g-2 mb-3"><div class="col-md-3"><label class="form-label">Exception date</label><input class="form-control" type="date" name="exception_date" value="{{ exception.date or '' }}"></div><div class="col-md-3"><label class="form-label">Kind</label><select class="form-select" name="exception_kind"><option value="">None entered</option>{% for kind in ['HOLIDAY','SPECIAL_PAY','SCHEDULE_EXCEPTION'] %}<option {% if exception.kind==kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Authoritative exception reference</label><input class="form-control" name="exception_reference" value="{{ exception.source_reference or '' }}" maxlength="255"></div></div>{% endfor %}
